<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <table border="2">
            <tr>
                <td colspan="2" style="text-align: center;">Pizza Shop 2.0</td>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter your name" style="color: palevioletred;"></td>
            </tr>
            <tr>
                <td>Pizza Topping</td>
                <td>
                    <label for="pepperoni">Supreme</label>
                    <input type="radio" id="pepperoni">
                    <label for="vegetarian">Vegetarian</label>
                    <input type="radio" id="vegetarian">
                    <label for="hawaiian">Hawaiian</label>
                    <input type="radio" id="hawaiian">
                </td>
            </tr>
            <tr>
                <td>
                    Pizza Size

                </td>
                <td>
                    <select name="size" id="">
                        <option value="small" style="color: palevioletred;">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>

                </td>
            </tr>
            <tr>
                <td>Optional Exatra</td>
                <td>
                    <input type="checkbox" id="extra checse">
                    <label for="extra checse">Extra Checse</label>
                    <input type="checkbox" id="gluten free base">
                    <label for="gluten free base">Gluten Free base</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="Adress">Delivery Instruction :</label><br>
                    <textarea name="textarea" id=""></textarea>
                <td>
            <tr>
                <td>
                    <button type="submit">
                        Send my order
                    </button>
                </td>
            </tr>
        </table>
    </center>

</body>

</html>
